<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="DreamWings winged storybook">
  <defs>
    <linearGradient id="dwGold" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#b0672a"/>
      <stop offset="45%" stop-color="#efa437"/>
      <stop offset="100%" stop-color="#ffeccb"/>
    </linearGradient>
    <linearGradient id="dwGoldSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#dd8c32"/>
      <stop offset="100%" stop-color="#ffdfae"/>
    </linearGradient>
    <linearGradient id="dwPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf1"/>
      <stop offset="100%" stop-color="#efd5ab"/>
    </linearGradient>
    <radialGradient id="dwHalo" cx="50%" cy="58%" r="52%">
      <stop offset="0%" stop-color="#ffd88a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffd88a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="68" r="50" fill="url(#dwHalo)"/>

  <!-- left wing: broad, sweeping up and out from the spine -->
  <g>
    <path d="M58 80C46 64 30 46 6 32c-3-2-3-8 2-10 3-1 6 0 9 2 18 12 34 28 45 46 4 7 3 12-4 10Z" fill="url(#dwGold)"/>
    <path d="M56 84C44 72 28 60 8 52c-4-2-4-8 1-10 4-1 8 1 11 3 14 10 28 24 38 34 4 5 3 8-2 5Z" fill="url(#dwGoldSoft)" opacity=".95"/>
    <g stroke="#fff1d4" stroke-width="1.5" stroke-linecap="round" opacity=".75">
      <path d="M20 30C34 44 46 58 56 74"/>
      <path d="M14 40C28 52 40 66 52 80"/>
    </g>
  </g>
  <!-- right wing -->
  <g transform="translate(120,0) scale(-1,1)">
    <path d="M58 80C46 64 30 46 6 32c-3-2-3-8 2-10 3-1 6 0 9 2 18 12 34 28 45 46 4 7 3 12-4 10Z" fill="url(#dwGold)"/>
    <path d="M56 84C44 72 28 60 8 52c-4-2-4-8 1-10 4-1 8 1 11 3 14 10 28 24 38 34 4 5 3 8-2 5Z" fill="url(#dwGoldSoft)" opacity=".95"/>
    <g stroke="#fff1d4" stroke-width="1.5" stroke-linecap="round" opacity=".75">
      <path d="M20 30C34 44 46 58 56 74"/>
      <path d="M14 40C28 52 40 66 52 80"/>
    </g>
  </g>

  <!-- open book -->
  <g>
    <path d="M60 70c-11-7-23-9-34-4v24c11-5 23-3 34 4Z" fill="url(#dwPage)" stroke="#a9713a" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M60 70c11-7 23-9 34-4v24c-11-5-23-3-34 4Z" fill="url(#dwPage)" stroke="#a9713a" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M60 70v24" stroke="#7d4c22" stroke-width="2.8" stroke-linecap="round"/>
    <g stroke="#d8b689" stroke-width="1.7" stroke-linecap="round">
      <path d="M35 74c7-1.8 14-1.2 20 1.8"/>
      <path d="M35 81c7-1.8 14-1.2 20 1.8"/>
      <path d="M65 75.8c6-3 13-3.6 20-1.8"/>
      <path d="M65 82.8c6-3 13-3.6 20-1.8"/>
    </g>
  </g>

  <path d="M60 14l2.6 6.8L69 24l-6.4 3.2L60 34l-2.6-6.8L51 24l6.4-3.2Z" fill="url(#dwGold)"/>
</svg>
