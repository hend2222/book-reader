<!DOCTYPE html>
<html lang="en">
<head>
    <script src="dw-theme.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>DreamWings | Sign In</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS File -->
    <link rel="stylesheet" href="library.style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dw-theme.css">
</head>
<body class="auth-body">

    <!-- Back to Home Button -->
    <a href="home.html" class="auth-back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo-icon">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <h2>Welcome Back! 🌟</h2>
            <p class="auth-subtitle">Log in to continue your magical reading journey.</p>

            <form class="comment-form" id="login-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address" class="form-input">
                </div>

                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" class="form-input">
                </div>

                <button type="submit" class="btn-read-now" style="width: 100%; justify-content: center; margin-top: 10px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>

              <button type="button" id="google-btn" class="google-login-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #333; border: 1px solid #ddd; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px;">
    <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.32 7.23 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
    </svg>
    Sign in with Google
</button>

            </form>

            <p class="auth-switch-text">
                Don't have an account? <a href="signup.html">Create one</a>
            </p>
        </div>
    </div>

 
<script type="module" src="i18n.js"></script>
<script type="module" src="auth.js"></script>

    <script type="module" src="notifications.js"></script>
</body>
</html>
