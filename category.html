<style>
.category-shelf-hero .hero-content{text-align:center}.category-shelf-hero .back-link{display:inline-block;margin-bottom:18px}
#categorySymbol{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;color:white;font-size:28px;box-shadow:0 10px 24px #0005}
#categoryBooks .shelf-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end;gap:34px 28px;padding-bottom:8px}
#categoryBooks .book-card-real{position:relative;cursor:pointer;text-align:center;min-width:0}
#categoryBooks .book-card-real .book-3d-wrapper{width:190px;height:270px;margin:auto;perspective:1000px}
#categoryBooks .book-card-real .real-book-cover{width:190px;height:270px;position:relative;overflow:hidden;border-radius:5px 13px 13px 5px;box-shadow:-7px 0 15px #0008,0 13px 25px #0008;transition:transform .35s;transform-style:preserve-3d}
#categoryBooks .book-card-real:hover .real-book-cover{transform:translateY(-12px) rotateY(-9deg)}
#categoryBooks .real-book-cover img{width:100%;height:100%;object-fit:cover;display:block}
#categoryBooks .book-spine-effect{position:absolute;inset:0 auto 0 0;width:13px;background:linear-gradient(90deg,#0009,#fff3,#0002);pointer-events:none}
#categoryBooks .book-shadow{height:16px;width:80%;margin:5px auto 0;background:radial-gradient(ellipse,#0009,transparent 70%)}
#categoryBooks .dw-book-caption{margin-top:10px;color:#fff0df;font:600 15px Quicksand,sans-serif}
#categoryBooks .dw-book-caption span{display:block;color:#d9b99a;font-size:12px;margin-top:4px}
#categoryBooks .dw-admin-actions{display:flex;justify-content:center;gap:9px;margin:12px auto 0;position:relative;z-index:5}
#categoryBooks .dw-admin-actions button{border:0;border-radius:18px;padding:8px 13px;color:#fff;font:700 12px Quicksand;cursor:pointer;box-shadow:0 3px 8px #0004}
#categoryBooks .dw-admin-edit{background:linear-gradient(135deg,#bd7830,#e9ad51)}#categoryBooks .dw-admin-delete{background:linear-gradient(135deg,#923d35,#c85b4c)}
#categoryBooks .dw-cat-empty{grid-column:1/-1;text-align:center;padding:40px;color:#e8cdb1}
</style>    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
